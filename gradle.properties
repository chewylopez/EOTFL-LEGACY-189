# Memory for the Minecraft decompilation process in setupDecompWorkspace.
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false

# ForgeGradle 2.1 and Minecraft 1.8.9 need Java 8. Gradle 4.9's launcher runs on any
# modern JDK and forks a JDK 8 build JVM from this property, which is why the wrapper
# is on 4.9 rather than the MDK's original 2.7 -- see the note in gradle-wrapper.properties.
org.gradle.java.home=/home/pablo/.jdks/jdk8u512-b09
