# Bumped from the MDK's original Gradle 2.7 to 4.9.
#
# Two reasons:
#  1. IntelliJ 2026.1 refuses to import any Gradle older than 4.6 (IDEA-368384), so a
#     2.7 workspace could only ever be built from the command line.
#  2. Gradle 2.7's launcher parses the java version before it reads org.gradle.java.home
#     and cannot parse "21.0.12.1", so it required JAVA_HOME to be set by hand.
#
# ForgeGradle 2.1.6 runs fine on 4.9, and 4.9's launcher works on a modern JDK while
# forking a JDK 8 JVM for the build itself. Verified: build JVM is 1.8.0_512.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-4.9-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
